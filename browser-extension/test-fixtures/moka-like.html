<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moka 风格 Vue / Element UI · 脱敏验收</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="page">
  <nav class="fixture-nav"><a href="generic.html">普通表单</a><a href="beisen-like.html">北森风格</a><a href="moka-like.html">Moka 风格</a></nav>
  <p class="fixture-note">Moka 风格模拟页：Vue 式受控输入、Element UI 下拉、多条现有经历区块及异步加载字段。不是 Moka 官网。</p>
  <section class="sheet"><header><h1>候选人信息表</h1><p>Vue / Element UI 风格控件模拟</p></header><form class="step">
    <fieldset><legend>个人信息</legend><div class="grid">
      <div class="el-form-item"><label class="el-form-item__label">姓名</label><input class="el-input__inner vue-model"></div>
      <div class="el-form-item"><label class="el-form-item__label">电子邮箱</label><input class="el-input__inner vue-model"></div>
      <div class="el-form-item"><label class="el-form-item__label">手机号码</label><input class="el-input__inner vue-model"></div>
      <div class="el-form-item"><label class="el-form-item__label">意向城市</label><input class="el-select__input" role="combobox" aria-label="意向城市" readonly placeholder="请选择"></div>
    </div></fieldset>
    <fieldset><legend>教育经历 1</legend><div class="grid"><div class="el-form-item"><label class="el-form-item__label">学校名称</label><input class="vue-model"></div><div class="el-form-item"><label class="el-form-item__label">专业名称</label><input class="vue-model"></div><div class="el-form-item"><label class="el-form-item__label">入学时间</label><input type="month" class="vue-model"></div><div class="el-form-item"><label class="el-form-item__label">毕业时间</label><input type="month" class="vue-model"></div></div></fieldset>
    <fieldset><legend>实习经历 1</legend><div class="grid"><div class="el-form-item"><label class="el-form-item__label">公司名称</label><input class="vue-model"></div><div class="el-form-item"><label class="el-form-item__label">职位</label><input class="vue-model"></div><div class="el-form-item wide"><label class="el-form-item__label">工作内容</label><textarea class="vue-model"></textarea></div></div></fieldset>
    <div id="moka-async"></div><div class="actions"><button type="button" id="load-more" class="secondary">模拟异步加载项目</button><button type="submit">提交（已拦截）</button></div>
  </form></section>
</main><script>
const model = new WeakMap(); document.querySelectorAll('.vue-model').forEach((element) => { model.set(element, ''); element.addEventListener('input', (event) => model.set(element, event.target.value)); element.addEventListener('change', (event) => model.set(element, event.target.value)); });
const combo = document.querySelector('[role="combobox"]'); combo.addEventListener('click', () => { document.querySelector('.dropdown')?.remove(); const menu = document.createElement('div'); menu.className = 'dropdown'; const rect = combo.getBoundingClientRect(); menu.style.cssText = `left:${rect.left}px;top:${rect.bottom + 4}px`; menu.innerHTML = '<div class="el-select-dropdown__item" role="option">深圳市</div><div class="el-select-dropdown__item" role="option">香港</div><div class="el-select-dropdown__item" role="option">广州市</div>'; menu.addEventListener('click', (event) => { combo.value = event.target.textContent; combo.dispatchEvent(new Event('change', { bubbles: true })); menu.remove(); }); document.body.append(menu); });
document.querySelector('#load-more').addEventListener('click', (event) => { event.currentTarget.disabled = true; event.currentTarget.textContent = '加载中…'; setTimeout(() => { document.querySelector('#moka-async').innerHTML = '<fieldset><legend>项目经历 1</legend><div class="grid"><div class="el-form-item"><label class="el-form-item__label">项目名称</label><input></div><div class="el-form-item"><label class="el-form-item__label">本人角色</label><input></div><div class="el-form-item wide"><label class="el-form-item__label">项目描述</label><textarea></textarea></div></div></fieldset>'; event.currentTarget.textContent = '项目已加载，请重新扫描'; }, 650); });
document.querySelector('form').addEventListener('submit', (event) => { event.preventDefault(); alert('测试页已阻止提交'); });
</script></body></html>
