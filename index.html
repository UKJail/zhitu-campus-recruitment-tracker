    (function(){
      'use strict';
      var REF_W=1464,REF_H=949,PHOTO_W=836,PANE_W=628,CARD_W=613,CARD_H=922;
      var CONTENT_H=697,IMG_W=1177,IMG_H=1336,IMG_REF_SCALE=836/1177;
      var PANE_RATIO=PANE_W/REF_W,HERO_W=681,HERO_H=219,REF_CARD_ASPECT=692/855;

      var TP={pad:.1076,h1Top:.08656,h1Fs:.06839,subTop:.17368,subFs:.0309,emTop:.25435,emH:.10257,emR:.0202,ephFs:.02702,ephPad:.0332,pwTop:.36851,pwH:.10839,btnTop:.50435,btnH:.10981,btnFs:.0275,arrow:.026,btnGap:.02,divTop:.68222,orFs:.02245,orPad:.051,divH:.0026,gTop:.76445,gH:.09966,gIcon:.032,gtFs:.03205,gGap:.026,btTop:.89668,btFs:.02876,badgeH:.0742,heroFs:.1058,heroLh:1.1246,heroBot:.06493,heroGap:-.30423,heroSide:.0525};
      var mqLandscape=window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
      var mqPortrait=window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');
      var photo=document.getElementById('photo'),pane=document.getElementById('pane'),card=document.getElementById('card'),cardIn=document.getElementById('cardIn'),hero=document.getElementById('hero'),hl1=document.getElementById('hl1'),hl2=document.getElementById('hl2');
      var current='';
      function clearInline(){[photo,pane,card,cardIn,hero].forEach(function(el){el.style.cssText='';});document.documentElement.style.cssText='';}

      function lerp(a,b,t){return a+(b-a)*Math.max(0,Math.min(1,t));}
      function photoRatio(vw){var full=1-PANE_RATIO;if(vw>=RAMP_HI){return full;}if(vw>=RAMP_LO){return lerp(PHOTO_MIN,full,(vw-RAMP_LO)/(RAMP_HI-RAMP_LO));}if(vw>=RAMP_LO2){return lerp(PHOTO_MIN2,PHOTO_MIN,(vw-RAMP_LO2)/(RAMP_LO-RAMP_LO2));}return PHOTO_MIN2;}
      function placeCard(paneW,vh){var cs=Math.min(paneW/PANE_W,vh/CONTENT_H);var gapL=1*cs,mT=14*cs,mB=13*cs,mR=14*cs;var cw=Math.max(CARD_W*cs,paneW-gapL-mR);var ch=vh-mT-mB;card.style.left=gapL+'px';card.style.top=mT+'px';card.style.width=cw+'px';card.style.height=ch+'px';card.style.borderRadius=(26*cs)+'px';card.style.borderWidth=Math.max(1,cs)+'px';cardIn.style.transform='translate('+((cw-CARD_W*cs)/2)+'px,0) scale('+cs+')';document.documentElement.style.setProperty('--cs',cs);}

      function headlineMeasure(){var span=document.createElement('span');var sample=document.getElementById('hl1');var cs=getComputedStyle(sample);span.textContent='Find Signal to Action Instantly';span.style.cssText='position:fixed;visibility:hidden;white-space:nowrap;font-family:'+cs.fontFamily+';font-size:'+cs.fontSize+';font-weight:'+cs.fontWeight+';letter-spacing:'+cs.letterSpacing+';word-spacing:'+cs.wordSpacing+';font-variation-settings:'+cs.fontVariationSettings+';';document.body.appendChild(span);var width=span.getBoundingClientRect().width;span.remove();return width;}
